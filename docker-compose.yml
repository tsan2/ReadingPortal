services:
  api:
    build: .
    ports:
      - "8000:8080"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18.6-alpine3.23
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=reading_portal_db
    ports:
      - "5431:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d reading_portal_db"]
      interval: 10s
      timeout: 5s
      retries: 3



volumes:
  db_data: